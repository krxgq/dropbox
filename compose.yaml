services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dropbox
      POSTGRES_PASSWORD: local-training-only
      POSTGRES_DB: dropbox
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dropbox -d dropbox']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
